name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Export notebooks
        run: uv run nbdev-export

      - name: Check no uncommitted changes after export
        run: |
          git diff --exit-code || (echo "ERROR: Notebooks not in sync with exported Python. Run 'nbdev-export' and commit." && exit 1)

      - name: Run tests
        run: uv run nbdev-test
